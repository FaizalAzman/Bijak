# Every pull request (and every push to main) must pass the same checks as `npm run verify`:
# typecheck, lint, content validation and the full test suite with coverage thresholds.
name: Verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total; const row=(k)=>'| '+k+' | '+t[k].pct+'% |'; console.log(['| Coverage | |','|---|---|',row('statements'),row('branches'),row('functions'),row('lines')].join('\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi
